<div class="space-y-10 animate-fade-in">
  <!-- KPI Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
    <div
      *ngFor="let kpi of kpis"
      class="border-none shadow-elegant p-6 group hover:-translate-y-1 transition-all bg-card rounded-xl duration-300 shadow text-card-foreground"
    >
      <p class="text-[10px] font-black uppercase text-muted-foreground tracking-widest mb-4">
        {{ kpi.label }}
      </p>
      <div class="flex items-end justify-between">
        <div>
          <h4 class="text-4xl font-black text-primary">{{ kpi.value }}</h4>
          <p class="text-[10px] font-bold mt-2 text-muted-foreground uppercase">{{ kpi.sub }}</p>
        </div>
        <span class="bg-emerald-500/10 text-emerald-500 border-none font-black h-7 px-3">{{
          kpi.trend
        }}</span>
      </div>
    </div>
  </div>

  <!-- Performance Chart + Sidebar -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Performance Card -->
    <div
      class="lg:col-span-2 border-none shadow-elegant bg-card rounded-xl overflow-hidden shadow text-card-foreground"
    >
      <div class="flex flex-row items-center justify-between p-8">
        <h4 class="text-xl font-black flex items-center gap-3">
          <lucide-icon [img]="icons.BarChart3" class="text-primary w-5 h-5"></lucide-icon>
          TRAFIC & PERFORMANCE GLOBALE
        </h4>
        <div class="flex gap-2">
          <button app-button>Jour</button>
          <button app-button>Mois</button>
        </div>
      </div>

      <div class="h-[350px] p-8 pt-0 flex flex-col justify-between">
        <div class="flex items-end gap-3 h-[250px]">
          <!--          <div *ngFor="let h of performanceData" class="flex-1 relative group">-->
          <!--            <div class="absolute bottom-0 inset-x-0 bg-primary/30 rounded-t-lg group-hover:bg-primary transition-all duration-300 shadow-glow"-->
          <!--                 [style.height.%]="h"></div>-->
          <!--            <span *ngIf="h > 80" class="absolute -top-6 left-1/2 -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-opacity">-->
          <!--              <span class="bg-green-500 text-white text-[8px] px-1 rounded h-4 inline-block">Peak</span>-->
          <!--            </span>-->
          <!--          </div>-->
        </div>

        <div
          class="flex justify-between text-[10px] font-black text-muted-foreground uppercase tracking-tighter pt-4"
        >
          <span *ngFor="let m of months">{{ m }}</span>
        </div>
      </div>
    </div>

    <!-- Right Sidebar Cards -->
    <div class="space-y-6 h-full">
      <!-- Server Status -->
      <div
        class="flex-1 border-none shadow-elegant overflow-hidden bg-gradient-to-br from-primary to-accent text-white relative p-8 rounded-xl"
      >
        <lucide-icon
          [img]="icons.Zap"
          class="absolute -right-4 -bottom-4 w-32 h-32 opacity-50 rotate-7"
        ></lucide-icon>
        <h5 class="text-lg font-black uppercase mb-4">Statut Serveur</h5>
        <div class="p8 pt-0 space-y-6">
        <div class="space-y-2">
          <div class="flex justify-between text-xs font-bold uppercase opacity-80">
            <span>Uptime</span>
            <span>99.98%</span>
          </div>
          <div class="h-1 bg-white/20 rounded-full overflow-hidden">
            <div class="h-full bg-white w-[99.98%]"></div>
          </div>
        </div>
        <div class="flex items-center gap-4 pt-4">
          <div class="w-3 h-3 bg-white rounded-full animate-pulse shadow-glow"></div>
          <p class="text-sm font-bold italic">Tous les systèmes sont opérationnels</p>
        </div>
        </div>

      </div>

      <!-- Top Boutiques -->
      <app-card class="flex-1 border-none shadow-elegant overflow-hidden p-6 rounded-xl">
        <!-- <div class="border-none shadow-elegant overflow-hidden "> -->
          <h5 class="text-sm font-black uppercase tracking-widest text-muted-foreground mb-4">
            TOP BOUTIQUES
          </h5>
          <!-- <app-card-header class="text-lg font-black uppercase tracking-widest text-muted-foreground mb-4">
          <app-card-title>TOP BOUTIQUES</app-card-title>
          </app-card-header> -->
          <div
            *ngFor="let b of topBoutiques; let i = index"
            class="flex items-center justify-between group cursor-pointer mb-4"
          >
            <div class="flex items-center gap-3">
              <div
                class="w-8 h-8 rounded-lg bg-muted flex items-center justify-center font-bold text-xs group-hover:bg-primary group-hover:text-white transition-colors"
              >
                {{ i + 1 }}
              </div>
              <span class="font-bold text-sm">{{ b.name }}</span>
            </div>
            <div class="text-right">
              <p class="font-black text-sm text-primary">{{ b.ca }}</p>
              <p class="text-[10px] font-bold text-emerald-500">{{ b.trend }}</p>
            </div>
          </div>
        <!-- </div> -->
      </app-card>
    </div>
  </div>
</div>
