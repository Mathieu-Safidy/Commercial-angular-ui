
    <div class="min-h-screen bg-gray-100 py-10 px-4 sm:px-6 lg:px-8">
      <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="px-8 py-10">
          <h1 class="text-3xl font-bold text-gray-800 text-center mb-8">
            Approvisionner un produit
          </h1>

          <form (ngSubmit)="onSubmit()" #stockForm="ngForm" class="space-y-6">
            <!-- Sélection produit -->
            <div>
              <label for="produit" class="block text-sm font-medium text-gray-700 mb-1">
                Produit <span class="text-red-500">*</span>
              </label>
              <select
                id="produit"
                name="produit"
                [(ngModel)]="formData.idProduit"
                required
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm h-11 px-3"
                [disabled]="loadingProduits()"
              >
                <option value="">— Sélectionner un produit —</option>
                @for (p of produits(); track p._id) {
                  <option [value]="p._id">
                    {{ p.nom }} ({{ p.quantiteDisponible ?? 0 }} en stock)
                  </option>
                }
              </select>
            </div>

            <!-- Quantité -->
            <div>
              <label for="quantite" class="block text-sm font-medium text-gray-700 mb-1">
                Quantité à ajouter <span class="text-red-500">*</span>
              </label>
              <input
                id="quantite"
                name="quantite"
                type="number"
                min="1"
                [(ngModel)]="formData.quantite"
                required
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm h-11 px-3"
                placeholder="ex: 50"
              />
            </div>

            <!-- Prix d'achat -->
            <div>
              <label for="prixAchat" class="block text-sm font-medium text-gray-700 mb-1">
                Prix d'achat unitaire (optionnel)
              </label>
              <input
                id="prixAchat"
                name="prixAchat"
                type="number"
                step="0.01"
                min="0"
                [(ngModel)]="formData.prixAchat"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm h-11 px-3"
                placeholder="ex: 12500.00"
              />
            </div>

            <!-- Date d'entrée -->
            <div>
              <label for="dateEntree" class="block text-sm font-medium text-gray-700 mb-1">
                Date d'entrée (optionnel)
              </label>
              <input
                id="dateEntree"
                name="dateEntree"
                type="date"
                [(ngModel)]="formData.dateEntree"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm h-11 px-3"
              />
            </div>

            <!-- Commentaire -->
            <div>
              <label for="commentaire" class="block text-sm font-medium text-gray-700 mb-1">
                Commentaire / Fournisseur (optionnel)
              </label>
              <input
                id="commentaire"
                name="commentaire"
                type="text"
                [(ngModel)]="formData.commentaire"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm h-11 px-3"
                placeholder="ex: Fournisseur XYZ – Facture n°4587"
              />
            </div>

            <!-- Bouton + message -->
            <div class="pt-4">
              <button
                type="submit"
                [disabled]="submitting() || !formData.idProduit || !formData.quantite"
                class="w-full py-3 px-4 border border-transparent rounded-md shadow-sm text-white font-medium
                       bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500
                       disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors"
              >
                @if (submitting()) {
                  Enregistrement...
                } @else {
                  Ajouter au stock
                }
              </button>
            </div>

            @if (message()) {
              <div
                [ngClass]="{
                  'bg-green-100 border-green-400 text-green-700': messageType() === 'success',
                  'bg-red-100 border-red-400 text-red-700': messageType() === 'error',
                  'bg-yellow-100 border-yellow-400 text-yellow-700': messageType() === 'loading'
                }"
                class="mt-6 border-l-4 p-4 rounded-r-md"
              >
                {{ message() }}
              </div>
            }
          </form>
        </div>
      </div>
    </div>
