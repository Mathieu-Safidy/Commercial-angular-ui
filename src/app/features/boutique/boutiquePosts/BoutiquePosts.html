<div class="grid grid-cols-1 gap-4">
  <!-- Carte d'invitation à publier -->
  <ng-template [hasRole]="['Boutique', 'Admin']">
    <app-card class="border-none shadow-elegant overflow-hidden">
      <app-card-content class="p-0!">
        <div class="flex items-center gap-4 p-5">
          <div class="w-11 h-11 rounded-2xl bg-muted overflow-hidden flex-shrink-0">
            <img
              src="https://api.dicebear.com/7.x/avataaars/svg?seed=currentUser"
              class="w-full h-full object-cover"
              alt="Votre avatar"
            />
          </div>

          <!-- Champ factice → ouvre le dialog au clic -->
          <button
            type="button"
            (click)="openNewPostDialog()"
            class="flex-1 text-left rounded-2xl bg-muted/60 border border-border/50 px-4 py-3 text-sm text-muted-foreground hover:bg-muted hover:border-primary/30 transition-all cursor-pointer"
          >
            Quoi de neuf ? Partagez une actualité...
          </button>

          <button
            app-button
            variant="default"
            (click)="openNewPostDialog()"
            class="rounded-xl px-5 h-10 font-bold text-sm flex-shrink-0"
          >
            + Publier
          </button>
        </div>
      </app-card-content>
    </app-card>
  </ng-template>

  <!-- Liste des actualités -->
  @for (order of orders(); track order.id) {
    <app-card class="border-none shadow-elegan transition-all group overflow-hidden">
      <app-card-content class="p-0!">
        <div class="relative flex flex-col lg:flex-row lg:items-center p-6 gap-6">
          <div class="flex-1 flex items-center gap-6">
            <div
              class="w-14 h-14 rounded-2xl bg-muted overflow-hidden flex items-center justify-center"
            >
              <img
                [src]="'https://api.dicebear.com/7.x/avataaars/svg?seed=' + (order.id + 10)"
                class="w-full h-full max-h-[300px] object-cover"
                alt="Avatar"
              />
            </div>

            <div class="space-y-1">
              <div class="flex items-center gap-3">
                <h4 class="font-black text-lg">{{ order.customer }}</h4>
              </div>
              <div class="flex text-sm font-medium gap-4">
                <!-- <p class="flex items-center gap-4">
                  <span>{{ order.customer }}</span>
                </p> -->
                <p class="flex items-center gap-4 text-muted-foreground">
                  <span>{{ order.time }}</span>
                </p>
              </div>
            </div>
          </div>

          <div
            class="flex items-center justify-between lg:justify-end gap-12 border-t lg:border-t-0 pt-4 lg:pt-0"
          >
            <button app-button variant="ghost" size="icon" className="rounded-xl h-10 w-10">
              ⋮
            </button>
          </div>
        </div>

        <div class="p-6 pb-0">
          <p class="text-gray-800 mb-4">{{ order.text }}</p>
        </div>

        @if (order.image && order.image.length) {
          <div
            class="grid gap-2 p-6 pt-0"
            [ngClass]="{
              'grid-cols-1': order.image.length === 1,
              'grid-cols-2': order.image.length === 2,
              'grid-cols-3': order.image.length >= 3,
            }"
          >
            @for (img of order.image; track img) {
              <div class="overflow-hidden rounded-2xl bg-gray-100 flex justify-center">
                <img
                  [src]="img"
                  class="w-full h-auto max-h-75 object-contain"
                  (click)="openPreview(img)"
                />
              </div>
            }
          </div>
        }

        <div class="flex justify-around text-sm text-gray-500 border-t border-border/50 py-4 mt-2">
          <button class="flex gap-2 hover:text-blue-600 items-center cursor-pointer">
            <lucide-icon [img]="ThumbsUp" class="w-4 h-4"></lucide-icon> J'aime
          </button>
          <button class="flex gap-2 hover:text-blue-600 items-center cursor-pointer">
            <lucide-icon [img]="MessageSquareMore" class="w-4 h-4"></lucide-icon> Commenter
          </button>
          <button class="flex gap-2 hover:text-blue-600 items-center cursor-pointer">
            <lucide-icon [img]="Forward" class="w-4 h-4"></lucide-icon> Partager
          </button>
        </div>
      </app-card-content>
    </app-card>
  }
</div>
