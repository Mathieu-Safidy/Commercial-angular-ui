<div class="space-y-8 animate-fade-in">

  <!-- Header -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h2 class="text-3xl font-black tracking-tight">Gestion des Commandes</h2>
      <p class="text-muted-foreground">
        Suivez vos ventes et préparez vos expéditions.
      </p>
    </div>

    <div class="flex gap-3">
      <button app-button variant="outline" className="rounded-xl gap-2 h-11">
        <lucide-angular [img]="Calendar" class="w-4 h-4"></lucide-angular>
        Planning
      </button>
      <button app-button className="rounded-xl shadow-glow gap-2 h-11">
        <lucide-angular [img]="Package" class="w-4 h-4"></lucide-angular>
        Expéditions groupées
      </button>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="flex flex-wrap items-center gap-3">
    <button app-button className="rounded-full px-6 h-10 shadow-md">
      Tout
    </button>

    <button app-button variant="ghost" className="rounded-full px-6 h-10 gap-2">
      Nouveaux
      <app-badge class="h-5 min-w-5 p-0 flex items-center justify-center bg-primary text-white">
        2
      </app-badge>
    </button>

    <button app-button variant="ghost" className="rounded-full px-6 h-10">
      En préparation
    </button>

    <button app-button variant="ghost" className="rounded-full px-6 h-10">
      Expédiés
    </button>

    <div class="flex-1 min-w-[200px] relative lg:ml-8">
      <input
        appInput
        placeholder="Rechercher par n° commande ou client..."
        class="pl-9 h-11 bg-muted/50 border-none rounded-xl w-full"
      />
    </div>
  </div>

  <!-- Orders list -->
  <div class="grid grid-cols-1 gap-4">
    <app-card
      *ngFor="let order of orders"
      class="border-none shadow-elegant hover:scale-[1.01] transition-all cursor-pointer group overflow-hidden"
    >
      <app-card-content class="p-0!">
        <div class="relative flex flex-col lg:flex-row lg:items-center p-6 gap-6">

          <!-- Status bar -->
          <div
            class="absolute left-0 inset-y-0 w-1.5"
            [ngClass]="getStatusBarClass(order.status)">
          </div>

          <!-- Order info -->
          <div class="flex-1 flex items-center gap-6">
            <div class="w-14 h-14 rounded-2xl bg-muted flex items-center justify-center">
              <lucide-angular [img]="ShoppingBag" class="w-6 h-6 text-primary"></lucide-angular>
            </div>

            <div class="space-y-1">
              <div class="flex items-center gap-3">
                <h4 class="font-black text-lg">{{ order.id }}</h4>
                <app-badge
                  class="font-bold border-none h-6"
                  [ngClass]="getStatusBadgeClass(order.status)">
                  {{ order.status }}
                </app-badge>
              </div>

              <div class="flex text-sm font-medium gap-4">
                <p class="flex items-center gap-4"> <span><lucide-angular [img]="CircleCheck" class="w-4 h-4 text-primary"></lucide-angular></span> <span>{{ order.customer }}</span></p>
                <p class="flex items-center gap-4 text-muted-foreground"> <span><lucide-angular [img]="Clock" class="w-4 h-4 text-muted-foreground"></lucide-angular></span> <span>{{ order.time }}</span></p>
              </div>
            </div>
          </div>

          <!-- Stats -->
          <div class="flex items-center justify-between lg:justify-end gap-12 border-t lg:border-t-0 pt-4 lg:pt-0">
            <div class="flex items-center gap-8">
              <div class="text-center">
                <p class="text-[10px] font-bold text-muted-foreground uppercase">Articles</p>
                <p class="font-black">{{ order.items }}</p>
              </div>

              <div class="text-center">
                <p class="text-[10px] font-bold text-muted-foreground uppercase">Total</p>
                <p class="font-black text-primary text-xl">{{ order.total }}</p>
              </div>
            </div>

            <div class="flex items-center gap-2">
              <button app-button variant="secondary" className="rounded-xl h-10 px-6 font-bold">
                Gérer
              </button>
              <button app-button variant="ghost" size="icon" className="rounded-xl h-10 w-10">
                ⋮
              </button>
              ➜
            </div>
          </div>

        </div>
      </app-card-content>
    </app-card>

    <button
      app-button
      variant="ghost"
      className="w-full py-8 text-muted-foreground hover:text-primary font-bold rounded-2xl border-2 border-dashed border-muted">
      Charger plus de commandes
    </button>
  </div>
</div>
