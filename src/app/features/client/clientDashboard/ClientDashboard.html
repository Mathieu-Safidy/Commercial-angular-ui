<div class="container mx-auto px-4 py-8">
  <header class="mb-10 flex flex-col md:flex-row md:items-end justify-between gap-6">
    <div class="space-y-2">
      <h1 class="text-4xl font-bold tracking-tight">Bonjour, Alex</h1>
      <p class="text-muted-foreground text-lg">Découvrez les nouveautés et gérez vos achats.</p>
    </div>

    <div class="flex items-center gap-4 bg-muted/50 p-2 rounded-2xl border border-border/50">
      <div class="flex -space-x-3 overflow-hidden p-1">
        @for (i of avatars; track i) {
          <div class="inline-block h-10 w-10 rounded-full border-2 border-background bg-muted">
            <img
              [src]="'https://api.dicebear.com/7.x/avataaars/svg?seed=' + (i + 10)"
              alt="Avatar"
              class="rounded-full"
            />
          </div>
        }
      </div>
      <div class="px-3">
        <p class="text-xs font-bold text-primary uppercase tracking-wider">Favoris</p>
        <p class="text-sm font-semibold">12 boutiques actives</p>
      </div>
    </div>
  </header>

  <app-tabs defaultValue="shop" className="space-y-8">
    <div class="sticky top-16 z-40 backdrop-blur-sm py-4 -mx-4 px-4 overflow-x-auto border-b border-border">
      <app-tabs-list className="inline-flex bg-muted/50 p-1.5 h-auto rounded-xl ">
        <!-- <div class="bg-gray-100 rounded-xl p-1.5 shadow-inner"> -->

          <button appTabsTrigger  [value]="'shop'" class="gap-2 px-6 py-2.5 rounded-lg">
            <lucide-icon [img]="LayoutGrid" class="w-4 h-4"></lucide-icon>
            <span>Explorer</span>
          </button>
  
          <button appTabsTrigger  [value]="'all-products'" class="gap-2 px-6 py-2.5 rounded-lg">
            <lucide-icon [img]="LayoutGrid" class="w-4 h-4"></lucide-icon>
            <span>Tout les produis</span>
          </button>
  
          <button appTabsTrigger [value]="'history'" class="gap-2 px-6 py-2.5 rounded-lg">
            <lucide-icon [img]="ShoppingCart" class="w-4 h-4"></lucide-icon>
            <span>Mes Achats</span>
          </button>
  
          <button appTabsTrigger [value]="'rentals'" class="gap-2 px-6 py-2.5 rounded-lg">
            <lucide-icon [img]="MapPin" class="w-4 h-4"></lucide-icon>
            <span>Locations</span>
          </button>
  
          <button appTabsTrigger [value]="'reviews'" class="gap-2 px-6 py-2.5 rounded-lg">
            <lucide-icon [img]="MessageSquare" class="w-4 h-4"></lucide-icon>
            <span>Avis</span>
          </button>
          
          <button appTabsTrigger [value]="'posts'" class="gap-2 px-6 py-2.5 rounded-lg">
            <lucide-icon [img]="MessageSquare" class="w-4 h-4"></lucide-icon>
            <span>Posts</span>
          </button>

        <!-- </div> -->

      </app-tabs-list>
    </div>

    <div appTabsContent value="shop" class="block animate-in fade-in slide-in-from-bottom-4 duration-500">
      <app-client-shop></app-client-shop>
    </div>

    <div appTabsContent value="history" class="block animate-in fade-in slide-in-from-bottom-4 duration-500">
      <app-client-history></app-client-history>
    </div>

    <div appTabsContent value="rentals" class="block animate-in fade-in slide-in-from-bottom-4 duration-500">
      <app-client-rentals></app-client-rentals>
    </div>

    <div appTabsContent value="reviews" class="block animate-in fade-in slide-in-from-bottom-4 duration-500">
      <app-client-reviews></app-client-reviews>
    </div>
    
    <div appTabsContent value="posts" class="block animate-in fade-in slide-in-from-bottom-4 duration-500 pt-5">
      <app-boutique-posts></app-boutique-posts>
    </div>
    
    <div appTabsContent value="all-products" class="block animate-in fade-in slide-in-from-bottom-4 duration-500 pt-5">
      <app-products-catalogue></app-products-catalogue>
    </div>

  </app-tabs>
</div>
