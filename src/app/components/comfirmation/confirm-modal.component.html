<div
  *ngIf="modal.isOpen()"
  id="modal-backdrop"
  (click)="onBackdropClick($event)"
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm"
  style="animation: fadeIn 0.15s ease-out;"
>
  <div
    class="relative w-full max-w-md bg-background rounded-3xl shadow-2xl border border-border/60 overflow-hidden"
    style="animation: slideUp 0.2s ease-out;"
  >
    <!-- Bande colorée en haut -->
    <div
      class="h-1 w-full"
      [ngClass]="{
        'bg-destructive': modal.config()?.theme === 'danger',
        'bg-emerald-500': modal.config()?.theme === 'success',
        'bg-amber-500': modal.config()?.theme === 'warning',
        'bg-primary': modal.config()?.theme === 'info',
        'bg-foreground': modal.config()?.theme === 'logout'
      }"
    ></div>

    <!-- Bouton fermer -->
    <button
      (click)="modal.cancel()"
      class="absolute top-4 right-4 w-8 h-8 rounded-full flex items-center justify-center text-muted-foreground hover:text-foreground hover:bg-muted transition-all"
    >
      <lucide-icon [img]="X" class="w-4 h-4"></lucide-icon>
    </button>

    <div class="p-7 space-y-5">

      <!-- Icône -->
      <div class="flex items-start gap-4">
        <div
          class="w-12 h-12 rounded-2xl flex items-center justify-center flex-shrink-0"
          [ngClass]="theme.iconBg"
        >
          <lucide-icon
            [img]="theme.icon"
            class="w-5 h-5"
            [ngClass]="theme.iconColor"
          ></lucide-icon>
        </div>

        <div class="space-y-1 pt-0.5">
          <h3 class="text-lg font-black tracking-tight">{{ modal.config()?.title }}</h3>
          <p class="text-sm text-muted-foreground leading-relaxed">{{ modal.config()?.message }}</p>
        </div>
      </div>

      <!-- Détails optionnels (résumé panier, etc.) -->
      <div
        *ngIf="modal.config()?.details?.length"
        class="rounded-2xl border p-4 space-y-2 bg-muted/30"
        [ngClass]="theme.accentColor"
      >
        <div
          *ngFor="let detail of modal.config()?.details"
          class="flex items-center gap-2 text-sm font-medium"
        >
          <div class="w-1.5 h-1.5 rounded-full bg-muted-foreground/40 flex-shrink-0"></div>
          {{ detail }}
        </div>
      </div>

      <!-- Actions -->
      <div class="flex gap-3 pt-1">
        <button
          (click)="modal.cancel()"
          class="flex-1 h-11 rounded-2xl font-bold text-sm border border-border bg-muted/30 hover:bg-muted transition-all"
        >
          {{ modal.config()?.cancelLabel ?? 'Annuler' }}
        </button>
        <button
          (click)="modal.confirm()"
          [disabled]="modal.isLoading()"
          class="flex-1 h-11 rounded-2xl font-bold text-sm transition-all active:scale-[0.98] disabled:opacity-60 flex items-center justify-center gap-2"
          [ngClass]="theme.confirmClass"
        >
          <svg *ngIf="modal.isLoading()" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          {{ modal.isLoading() ? 'En cours...' : (modal.config()?.confirmLabel ?? 'Confirmer') }}
        </button>
      </div>

    </div>
  </div>
</div>

<style>
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
</style>
