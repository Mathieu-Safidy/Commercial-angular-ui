<!-- new-post-dialog.component.html -->

<div class="flex flex-col animate-fade-in">

  <!-- ─── En-tête ─── -->
 <div class="flex flex-row items-center justify-between px-6 py-4 border-b border-border">
  <div class="flex items-center gap-3 min-w-0">  <!-- ← supprimé flex-1 -->
    <div class="w-10 h-10 rounded-full border-2 border-primary overflow-hidden">
      <img
        src="https://api.dicebear.com/7.x/avataaars/svg?seed=currentUser"
        class="w-full h-full object-cover"
        alt="Votre avatar"
      />
    </div>
    <div>
      <p class="font-bold text-base text-foreground leading-tight">Nouvelle actualité</p>
      <p app-card-description class="text-xs">Visible par tous les membres</p>
    </div>
  </div>
  <button
    mat-icon-button
    mat-dialog-close
    class="rounded-full! items-center! justify-center! shrink-0 hover:bg-muted h-9! w-9! transition-colors ml-4"
  >
    <mat-icon class="text-muted-foreground">close</mat-icon>
  </button>
</div>

  <!-- ─── Corps ─── -->
  <mat-dialog-content class="flex-1 px-6 py-5 space-y-5 overflow-y-auto !max-h-[60vh]">

    <!-- Message -->
    <div class="space-y-1">
      <label app-card-description for="postText">
        Message <span class="text-primary">*</span>
      </label>
      <textarea
        id="postText"
        [(ngModel)]="form.text"
        rows="6"
        maxlength="1000"
        placeholder="Partagez une information, une annonce, un événement..."
        class="w-full p-3 rounded-2xl border border-border bg-muted/30 text-sm font-medium
               placeholder:text-muted-foreground/50 resize-none
               focus:outline-none focus:ring-2 focus:ring-primary/25 focus:border-primary/50 transition-all"
      ></textarea>
      <p class="text-right text-xs text-muted-foreground">{{ form.text.length }} / 1000</p>
    </div>

    <!-- Photos -->
    <div class="space-y-2">
      <label app-card-description>Photos (optionnel)</label>

      <label
        class="flex flex-col items-center justify-center w-full h-24 rounded-2xl border border-dashed border-border
               bg-muted/20 hover:bg-muted/40 hover:border-primary/40 transition-all cursor-pointer"
      >
        <lucide-angular [img]="ImageIcon" class="w-6 h-6 text-muted-foreground mb-1"></lucide-angular>
        <span class="text-xs text-muted-foreground font-medium">Cliquez pour ajouter des photos</span>
        <input type="file" accept="image/*" multiple class="hidden" (change)="onImageSelected($event)" />
      </label>

      <!-- Aperçu des images sélectionnées -->
      @if (form.imagePreviews.length) {
        <div
          class="grid gap-2 mt-2"
          [ngClass]="{
            'grid-cols-1': form.imagePreviews.length === 1,
            'grid-cols-2': form.imagePreviews.length === 2,
            'grid-cols-3': form.imagePreviews.length >= 3,
          }"
        >
          @for (preview of form.imagePreviews; track preview; let i = $index) {
            <div class="relative overflow-hidden rounded-2xl border border-border bg-muted/30 group">
              <img [src]="preview" class="w-full h-28 object-cover" />
              <button
                type="button"
                (click)="removeImage(i)"
                class="absolute top-2 right-2 bg-card/90 hover:bg-primary hover:text-primary-foreground
                       text-muted-foreground border border-border rounded-full
                       w-7 h-7 flex items-center justify-center text-xs transition-all
                       opacity-0 group-hover:opacity-100"
              >
                ✕
              </button>
            </div>
          }
        </div>
      }
    </div>

  </mat-dialog-content>

  <!-- ─── Footer ─── -->
  <mat-dialog-actions class="px-6 py-4 border-t border-border flex justify-end gap-3 !min-h-0">
    <button
      app-button
      variant="outline"
      mat-dialog-close
      class="rounded-full px-6"
    >
      Annuler
    </button>
    <button
      app-button
      [disabled]="!form.text.trim() && !form.imagePreviews.length"
      (click)="publish()"
      class="rounded-full px-8 shadow-glow disabled:opacity-40 disabled:cursor-not-allowed disabled:shadow-none"
    >
      Publier
    </button>
  </mat-dialog-actions>

</div>
